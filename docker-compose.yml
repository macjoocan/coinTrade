version: '3.8'

services:
  upbit-trader:
    build: .
    container_name: upbit-trader
    restart: unless-stopped

    # 환경변수 (.env 파일에서 로드)
    env_file:
      - .env
    environment:
      - DATA_PATH=/app/data

    # 볼륨 마운트
    volumes:
      # 설정 파일
      - ./settings.json:/app/settings.json:ro
      # 데이터 파일 (읽기/쓰기)
      - ./data:/app/data

    # 로그 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 헬스체크
    healthcheck:
      test: ["CMD", "python", "-c", "import pyupbit; print('OK')"]
      interval: 5m
      timeout: 10s
      retries: 3

  # 웹 대시보드
  upbit-web:
    build: .
    container_name: upbit-web
    restart: unless-stopped
    command: ["python", "-u", "upbit_web_dashboard.py"]
    env_file:
      - .env
    volumes:
      - ./settings.json:/app/settings.json:ro
      - ./data:/app/data
    ports:
      - "5001:5001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
